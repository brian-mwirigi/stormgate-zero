name: Verify Hydraulics, Traces & SHA-256 Ledger

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      STORMGATE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify 4-block SHA-256 compliance ledger & recorded traces
        run: python scripts/verify_all.py
      - name: Run offline hydraulic & trace test suite (26 tests)
        run: python -m pytest -q
